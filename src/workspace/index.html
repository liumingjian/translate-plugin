<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>图片翻译工作区</title>
    <link rel="stylesheet" href="./workspace.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>图片翻译工作区</h1>
        <p>导入后默认选择整张图片</p>
      </div>
      <div class="header-actions">
        <label class="clipboard-toggle">
          <input id="autoReadClipboard" type="checkbox" />
          <span>自动读取系统剪贴板图片</span>
        </label>
        <button id="reimport" type="button" class="secondary" disabled>重新导入</button>
        <button id="clear" type="button" class="secondary" disabled>清空</button>
      </div>
    </header>

    <main>
      <section class="image-pane" aria-labelledby="image-heading">
        <div class="pane-heading">
          <h2 id="image-heading">图片</h2>
          <div class="image-heading-actions">
            <span id="sourceMeta" class="muted"></span>
            <button id="newSelection" type="button" class="secondary" disabled>重新框选</button>
          </div>
        </div>
        <div id="emptyState" class="empty-state">
          <div class="empty-icon" aria-hidden="true">＋</div>
          <p>选择 PNG、JPEG 或 WebP 图片</p>
          <p class="muted">最大 20 MB，也可拖放或按 Ctrl/Cmd+V 粘贴</p>
          <button id="choose" type="button" class="primary">选择图片</button>
        </div>
        <div id="imageStage" class="image-stage hidden">
          <div class="image-frame">
            <img id="sourceImage" alt="待翻译图片" draggable="false" />
            <div id="cropSelection" class="crop-selection full-selection" aria-label="已选择整张图片">
              <span id="selectionLabel" class="selection-label">整张图片</span>
            </div>
          </div>
        </div>
        <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
        <p id="imageStatus" class="inline-status" role="status"></p>
        <button id="translate" type="button" class="primary translate" disabled>翻译选中区域</button>
      </section>

      <section class="result-pane" aria-labelledby="result-heading">
        <div class="pane-heading">
          <h2 id="result-heading">译文</h2>
          <span id="language" class="badge">自动 → 自动</span>
        </div>
        <div id="result" class="result muted" aria-live="polite">导入图片后，按 Enter 开始翻译</div>
        <p id="resultError" class="result-error hidden" role="alert"></p>
        <div class="result-actions">
          <button id="openOptions" type="button" class="secondary hidden">打开配置页</button>
          <button id="copy" type="button" class="secondary" disabled>复制译文</button>
        </div>
      </section>
    </main>

    <dialog id="privacyDialog" aria-labelledby="privacy-title">
      <h2 id="privacy-title">图片发送说明</h2>
      <p>你确认翻译的图像区域会发送到你配置的翻译服务。图片只在当前界面内存中处理，不写入扩展存储，也不进入翻译缓存。</p>
      <div class="dialog-actions">
        <button id="privacyCancel" type="button" class="secondary">暂不使用</button>
        <button id="privacyAccept" type="button" class="primary">我知道了</button>
      </div>
    </dialog>

    <script type="module" src="./workspace.ts"></script>
  </body>
</html>
